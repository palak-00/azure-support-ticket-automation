name: Continuous Integration & Automated Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    name: Run Unit Tests, CI Checks & Model Evaluation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax and Code Style Check (Ruff)
        run: |
          ruff check --select E,F,W --ignore E501 .

      - name: Evaluate Classifier on Reserved Test Set (>= 80% Target)
        run: |
          python scripts/evaluate.py

      - name: Execute Full PyTest Suite with Code Coverage
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker-build-check:
    name: Verify Docker Container Build Reproducibility
    runs-on: ubuntu-latest
    needs: test-and-evaluate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: azure-support-ticket-automation:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
