name: Deploy to Azure App Service (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write   # Mandatory for Azure OIDC Federated Credential authentication
  contents: read    # Required to check out repository code

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Authenticate with Azure using OpenID Connect (OIDC)
      # Zero-secret authentication: uses federated credential trust
      # -------------------------------------------------------------
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -------------------------------------------------------------
      # 2. Log in to Azure Container Registry (ACR) via Az CLI
      # -------------------------------------------------------------
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

      # -------------------------------------------------------------
      # 3. Build & Tag Container Image
      # -------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_SERVER }}/support-ticket-api:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/support-ticket-api:latest

      # -------------------------------------------------------------
      # 4. Deploy Custom Container to Azure App Service
      # -------------------------------------------------------------
      - name: Deploy Custom Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          images: '${{ secrets.AZURE_REGISTRY_SERVER }}/support-ticket-api:${{ github.sha }}'

      # -------------------------------------------------------------
      # 5. Post-Deployment Smoke Test & Health Check
      # -------------------------------------------------------------
      - name: Verify App Service Health Probe
        run: |
          echo "Waiting 30 seconds for App Service container warm-up..."
          sleep 30
          HEALTH_URL="https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/health"
          echo "Pinging health endpoint: $HEALTH_URL"
          curl -f -s -S --retry 5 --retry-delay 10 --max-time 15 "$HEALTH_URL" || {
            echo "Health probe failed. Check App Service application logs via: az webapp log tail --name ${{ secrets.AZURE_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}"
            exit 1
          }
          echo "Deployment verified successfully!"
