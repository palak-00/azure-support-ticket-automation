services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: azure-support-ticket-automation:latest
    container_name: support_ticket_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./tickets.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
